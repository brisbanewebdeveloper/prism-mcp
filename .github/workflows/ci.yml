name: CLI Integration
on:
  push:
    branches: [ main, master, release-** ]
  pull_request:
    branches: [ main, master ]

# Default-deny token: this workflow only checks out code + runs tests,
# so it doesn't need write to anything in the repo.
permissions:
  contents: read

jobs:
  # Runs once, not across the matrix, and is the cheapest job here — a leak is
  # cheaper to block than to purge. Training corpora reached this PUBLIC repo
  # twice (2026-05-05, and again 2026-05-25 three weeks after the cleanup), and
  # on the second occasion a .gitignore rule was the only control. An ignore
  # rule cannot see an already-tracked path or a `git add -f`; this checks what
  # is actually tracked. It also runs in prepublishOnly, because by the time a
  # push-triggered job starts the content is already public.
  private-content:
    name: No private content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check for private content
        run: node scripts/check-no-private-content.mjs

  cli-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python for Prism Browser contract
        if: runner.os == 'Linux' && matrix.node-version == '20.x'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Prism Browser Python runtime
        if: runner.os == 'Linux' && matrix.node-version == '20.x'
        run: python -m pip install --disable-pip-version-check playwright==1.58.0 playwright-stealth==2.0.3

      - name: Install Dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Private repo leak guard
        shell: bash
        run: |
          # Scan every file git tracks — extension-based grep misses dotfiles,
          # Dockerfiles, .gitignore, LICENSE, smithery.yaml, etc.
          # Split each term so this file doesn't self-match.
          #
          # 2026-08-02: this guard checked ONE term and stayed green while a
          # private Vercel team slug and a private client project name shipped
          # in the published npm package. One term is not a guard, it is a
          # single tripwire — every class of private identifier needs one.
          TERMS=(
            "synalux""-private"        # private repo name
            "dcostencos""-projects"    # private Vercel team slug
            "bcba""-private"           # private client project name
            "prism-aac""-internal"     # private application repo name
            "/Users/""admin"           # maintainer-local absolute paths
          )
          FAILED=0
          for TERM in "${TERMS[@]}"; do
            HITS=$(git ls-files | xargs grep -ln "$TERM" 2>/dev/null \
              | grep -v "package-lock.json" | grep -v ".github/workflows/ci.yml" || true)
            if [ -n "$HITS" ]; then
              echo "ERROR: private identifier '$TERM' leaked in tracked files:"
              git ls-files | xargs grep -n "$TERM" 2>/dev/null \
                | grep -v "package-lock.json" | grep -v ".github/workflows/ci.yml"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Raw-inference chokepoint guard
        shell: bash
        run: node scripts/no-raw-inference.mjs

      - name: Run Unit Tests
        # Skip the heavyweight CLI integration tests to keep parallel load low
        run: npx vitest run --exclude tests/verification/cli-integration.test.ts ${{ runner.os == 'Windows' && '--dangerouslyIgnoreUnhandledErrors' || '' }}

      - name: Process-Level CLI Tests
        run: npx vitest run tests/verification/cli-integration.test.ts ${{ runner.os == 'Windows' && '--dangerouslyIgnoreUnhandledErrors' || '' }}
