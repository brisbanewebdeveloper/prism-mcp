name: Publish prism-coder

on:
  push:
    tags:
      - 'v*'
  # First publish of a NEW npm name cannot use trusted publishing — claim the
  # name once by hand (npm login && npm publish in packages/prism-coder), then
  # configure the trusted publisher on npmjs.com and tags take over.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles 10.9.8.
      # Without this the publish goes out unauthenticated and npm answers E404.
      - run: npm install -g npm@latest
      - name: Check if version already published
        id: check
        working-directory: packages/prism-coder
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "prism-coder@$VER" version 2>/dev/null | grep -q "^$VER$"; then
            echo "Already published: prism-coder@$VER — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        working-directory: packages/prism-coder
        run: npm publish --access public
