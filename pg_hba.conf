# Prism MCP local PostgreSQL auth override.
#
# The upstream supabase/postgres image ships a local peer rule with
# `map=supabase_map`, which rejects local socket connections when the
# requested database role differs from the container OS user.
#
# Keep the postgres superuser path on peer auth, allow other local
# socket connections for startup scripts and local psql usage, and
# keep TCP connections password-authenticated.

local   all             postgres                                peer
local   all             all                                     trust

host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

local   replication     all                                     trust
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
